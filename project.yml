name: Jyro
options:
  createIntermediateGroups: true
  generateXcodeSchemes: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Jyro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: SharedCore
      - path: SheetUI
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyro.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        APPLICATION_EXTENSION_API_ONLY: NO
    dependencies:
      - target: JyroTranslate
        embed: true
      - target: JyroControl
        embed: true
  JyroTranslate:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExt
      - path: SharedCore
      - path: SheetUI
    info:
      path: ShareExt/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyro.app.translate
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  JyroControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.1"
    sources:
      - path: ControlWidget
      - path: SharedCore
    info:
      path: ControlWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyro.app.control
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES