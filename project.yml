name: Jyro
options:
  createIntermediateGroups: true
  generateXcodeSchemes: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.0.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Jyro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: SharedCore
      - path: SheetUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jyro
        CFBundleURLTypes:
          - CFBundleURLName: com.jyro.app
            CFBundleURLSchemes:
              - jyro
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyro.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        APPLICATION_EXTENSION_API_ONLY: NO
    dependencies:
      - target: JyroTranslate
        embed: true
      - target: JyroControl
        embed: true
      - target: JyroKeyboard
        embed: true
  JyroTranslate:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExt
      - path: SharedCore
      - path: SheetUI
    info:
      path: ShareExt/Info.plist
      properties:
        CFBundleDisplayName: Jyro Translate
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url").@count == $extensionItem.attachments.@count).@count == 1'
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TranslateViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyro.app.translate
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  JyroControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.1"
    sources:
      - path: ControlWidget
      - path: SharedCore
    info:
      path: ControlWidget/Info.plist
      properties:
        CFBundleDisplayName: Jyro Control
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyro.app.control
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  JyroKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Keyboard
      - path: SharedCore
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Jyro
        NSExtension:
          NSExtensionAttributes:
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyro.app.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES